{% extends 'base.html' %}{% block content %}<h3 class="mt-3">Finance</h3><form method="post" class="panel row g-2"><div class="col-md-3"><select class="form-select" name="client_id">{% for c in clients %}<option value="{{ c.id }}">{{ c.company_name }}</option>{% endfor %}</select></div><div class="col-md-2"><select class="form-select" name="kind"><option>retainer</option><option>one-time</option></select></div><div class="col-md-2"><input class="form-control" name="amount" type="number" step="0.01" placeholder="Amount" required></div><div class="col-md-2"><input class="form-control" type="date" name="due_date"></div><div class="col-md-2"><select class="form-select" name="status"><option>paid</option><option>pending</option><option>overdue</option></select></div><div class="col-md-12"><input class="form-control" name="notes" placeholder="Notes"></div><div class="col-12"><button class="btn btn-primary">Save payment</button></div></form><div class="panel mt-3 table-responsive"><table class="table"><tr><th>Client</th><th>Type</th><th>Amount</th><th>Status</th></tr>{% for p in payments %}<tr><td>{{p.client.company_name}}</td><td>{{p.kind}}</td><td>{{p.amount}}</td><td>{{p.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
