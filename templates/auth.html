<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"/><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet"></head><body class="auth-body"><div class="auth-card">
<h2>{{ 'Register' if mode=='register' else 'Login' }} - Pacaembu OS</h2>
<form method="post" class="d-grid gap-2">
{% if mode=='register' %}
<input class="form-control" name="name" placeholder="Name" required>
<select class="form-select" name="role"><option>Admin</option><option>Designer</option><option>Social media manager</option><option>Copywriter</option><option>Developer</option><option>Client</option></select>
{% endif %}
<input class="form-control" type="email" name="email" placeholder="Email" required>
<input class="form-control" type="password" name="password" placeholder="Password" required>
<button class="btn btn-primary">{{ 'Create account' if mode=='register' else 'Enter' }}</button>
</form>
<a href="{{ url_for('login' if mode=='register' else 'register') }}">{{ 'Already have account? Login' if mode=='register' else 'Need account? Register' }}</a>
</div></body></html>
