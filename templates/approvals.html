{% extends 'base.html' %}{% block content %}<h3 class="mt-3">Approvals</h3><form method="post" class="panel row g-2"><div class="col-md-3"><select class="form-select" name="client_id">{% for c in clients %}<option value="{{ c.id }}">{{ c.company_name }}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" name="item_type" placeholder="Type"></div><div class="col-md-2"><input class="form-control" name="item_id" type="number" placeholder="Item ID"></div><div class="col-md-3"><select class="form-select" name="status"><option>draft</option><option>internal review</option><option>sent to client</option><option>approved</option><option>changes requested</option><option>published</option></select></div><div class="col-md-12"><input class="form-control" name="notes" placeholder="Notes"></div><div class="col-12"><button class="btn btn-primary">Create approval</button></div></form><div class="panel mt-3 table-responsive"><table class="table"><tr><th>Client</th><th>Item</th><th>Status</th></tr>{% for a in rows %}<tr><td>{{ a.client_id }}</td><td>{{ a.item_type }} #{{ a.item_id }}</td><td>{{ a.status }}</td></tr>{% endfor %}</table></div>{% endblock %}
