{% extends 'base.html' %}{% block content %}<h3 class="mt-3">Projects</h3>
<form method="post" class="panel row g-2"><div class="col-md-3"><input name="name" class="form-control" placeholder="Project" required></div><div class="col-md-2"><select class="form-select" name="category"><option>social media</option><option>website</option><option>landing page</option><option>branding</option><option>paid traffic</option><option>maintenance</option><option>consulting</option></select></div><div class="col-md-2"><select class="form-select" name="status"><option>planning</option><option>in progress</option><option>waiting approval</option><option>revision</option><option>completed</option><option>cancelled</option></select></div><div class="col-md-2"><select class="form-select" name="priority"><option>low</option><option selected>medium</option><option>high</option></select></div><div class="col-md-2"><input class="form-control" type="date" name="deadline"></div><div class="col-md-3"><select class="form-select" name="client_id">{% for c in clients %}<option value="{{ c.id }}">{{ c.company_name }}</option>{% endfor %}</select></div><div class="col-md-3"><input class="form-control" name="responsible" placeholder="Responsible"></div><div class="col-md-6"><input class="form-control" name="checklist" placeholder="Checklist"></div><div class="col-md-12"><textarea class="form-control" name="comments" placeholder="Comments"></textarea></div><div class="col-12"><button class="btn btn-primary">Save project</button></div></form>
<div class="panel mt-3 table-responsive"><table class="table table-sm"><tr><th>Name</th><th>Client</th><th>Status</th><th>Deadline</th></tr>{% for p in projects %}<tr><td>{{p.name}}</td><td>{{p.client.company_name}}</td><td>{{p.status}}</td><td>{{p.deadline}}</td></tr>{% endfor %}</table></div>
{% endblock %}
