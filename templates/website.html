{% extends 'base.html' %}{% block content %}<h3 class="mt-3">Website Projects</h3><form method="post" class="panel row g-2"><div class="col-md-3"><select class="form-select" name="client_id">{% for c in clients %}<option value="{{ c.id }}">{{ c.company_name }}</option>{% endfor %}</select></div><div class="col-md-3"><input class="form-control" name="domain" placeholder="Domain" required></div><div class="col-md-3"><input class="form-control" name="hosting_provider" placeholder="Hosting"></div><div class="col-md-3"><input class="form-control" name="cms_platform" placeholder="CMS"></div><div class="col-md-3"><input class="form-control" name="admin_url" placeholder="Admin URL"></div><div class="col-md-3"><input class="form-control" name="project_stage" placeholder="Stage"></div><div class="col-md-3"><input class="form-control" name="backup_status" placeholder="Backup"></div><div class="col-md-12"><textarea class="form-control" name="maintenance_notes" placeholder="Maintenance notes"></textarea></div><div class="col-12"><button class="btn btn-primary">Save website project</button></div></form><div class="panel mt-3 table-responsive"><table class="table"><tr><th>Client</th><th>Domain</th><th>CMS</th><th>Stage</th></tr>{% for i in items %}<tr><td>{{i.client.company_name}}</td><td>{{i.domain}}</td><td>{{i.cms_platform}}</td><td>{{i.project_stage}}</td></tr>{% endfor %}</table></div>{% endblock %}
