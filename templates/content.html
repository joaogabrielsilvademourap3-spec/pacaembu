{% extends 'base.html' %}{% block content %}<h3 class="mt-3">Editorial Calendar</h3><form method="post" class="panel row g-2"><div class="col-md-3"><select class="form-select" name="client_id">{% for c in clients %}<option value="{{ c.id }}">{{ c.company_name }}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" name="platform" placeholder="Platform" required></div><div class="col-md-2"><input class="form-control" name="content_type" placeholder="Type" required></div><div class="col-md-2"><input class="form-control" type="date" name="publish_date" required></div><div class="col-md-3"><select class="form-select" name="approval_status"><option>draft</option><option>internal review</option><option>sent to client</option><option>approved</option><option>changes requested</option><option>published</option></select></div><div class="col-md-12"><textarea class="form-control" name="caption" placeholder="Caption"></textarea></div><div class="col-12"><button class="btn btn-primary">Save content</button></div></form><div class="panel mt-3 table-responsive"><table class="table"><tr><th>Date</th><th>Client</th><th>Platform</th><th>Status</th></tr>{% for i in items %}<tr><td>{{i.publish_date}}</td><td>{{i.client.company_name}}</td><td>{{i.platform}}</td><td>{{i.approval_status}}</td></tr>{% endfor %}</table></div>{% endblock %}
