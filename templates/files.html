{% extends 'base.html' %}{% block content %}<h3 class="mt-3">File Manager</h3><form method="post" enctype="multipart/form-data" class="panel row g-2"><div class="col-md-4"><input type="file" name="file" class="form-control" required></div><div class="col-md-3"><select class="form-select" name="client_id"><option value="">No Client</option>{% for c in clients %}<option value="{{ c.id }}">{{ c.company_name }}</option>{% endfor %}</select></div><div class="col-md-3"><select class="form-select" name="project_id"><option value="">No Project</option>{% for p in projects %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></div><div class="col-md-12"><input class="form-control" name="notes" placeholder="File notes"></div><div class="col-12"><button class="btn btn-primary">Upload</button></div></form><div class="panel mt-3"><ul>{% for f in files %}<li>{{ f.filename }} — {{ f.notes }}</li>{% endfor %}</ul></div>{% endblock %}
