{% extends 'base.html' %}{% block content %}<h3 class="mt-3">AI Assistant</h3><form method="post" class="panel"><textarea class="form-control" name="prompt" placeholder="What should I focus on today?" required></textarea><button class="btn btn-primary mt-2">Analyze</button></form>{% if answer %}<div class="panel mt-3"><strong>Response:</strong> {{ answer }}</div>{% endif %}<div class="panel mt-3"><h6>Recent prompts</h6><ul>{% for l in logs %}<li><strong>{{ l.prompt }}</strong><br>{{ l.response }}</li>{% endfor %}</ul></div>{% endblock %}
