<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pacaembu OS Installer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-card">
    <h2>Pacaembu OS Installer</h2>
    <p class="text-muted">One-time setup for Hostinger/HostGator or any Linux hosting.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="post" class="d-grid gap-2">
      <input class="form-control" name="secret_key" placeholder="SECRET_KEY" required>
      <input class="form-control" name="database_url" value="{{ default_db }}" placeholder="DATABASE_URL" required>
      <input class="form-control" name="admin_name" placeholder="Admin name" required>
      <input class="form-control" name="admin_email" type="email" placeholder="Admin email" required>
      <input class="form-control" name="admin_password" type="password" placeholder="Admin password" required>
      <label><input type="checkbox" name="seed_demo"> Install demo seed data</label>
      <button class="btn btn-primary">Install now</button>
    </form>
  </div>
</body>
</html>
