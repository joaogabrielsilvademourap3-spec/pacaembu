{% extends 'base.html' %}{% block content %}<h3 class="mt-3">Metrics</h3><form method="post" class="panel row g-2"><div class="col-md-3"><select class="form-select" name="client_id">{% for c in clients %}<option value="{{ c.id }}">{{ c.company_name }}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" type="month" name="month" required></div><div class="col-md-2"><input class="form-control" name="followers" placeholder="Followers" type="number"></div><div class="col-md-2"><input class="form-control" name="reach" placeholder="Reach" type="number"></div><div class="col-md-2"><input class="form-control" name="impressions" placeholder="Impressions" type="number"></div><div class="col-md-2"><input class="form-control" name="engagement" placeholder="Engagement" type="number"></div><div class="col-md-2"><input class="form-control" name="clicks" placeholder="Clicks" type="number"></div><div class="col-md-2"><input class="form-control" name="leads" placeholder="Leads" type="number"></div><div class="col-md-2"><input class="form-control" name="conversions" placeholder="Conversions" type="number"></div><div class="col-md-2"><input class="form-control" name="website_traffic" placeholder="Website traffic" type="number"></div><div class="col-12"><button class="btn btn-primary">Save metrics</button></div></form><div class="panel mt-3"><strong>AI Insight:</strong> {{ insight }}</div><div class="panel mt-2 table-responsive"><table class="table"><tr><th>Month</th><th>Client</th><th>Followers</th><th>Reach</th><th>Conversions</th></tr>{% for r in rows %}<tr><td>{{r.month}}</td><td>{{r.client.company_name}}</td><td>{{r.followers}}</td><td>{{r.reach}}</td><td>{{r.conversions}}</td></tr>{% endfor %}</table></div>{% endblock %}
