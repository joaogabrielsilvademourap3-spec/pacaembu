{% extends 'base.html' %}{% block content %}<h3 class="mt-3">Reports</h3><form method="post" class="panel row g-2"><div class="col-md-4"><select class="form-select" name="client_id">{% for c in clients %}<option value="{{ c.id }}">{{ c.company_name }}</option>{% endfor %}</select></div><div class="col-md-3"><input class="form-control" type="month" name="month" required></div><div class="col-md-2"><button class="btn btn-primary">Generate report</button></div></form><div class="panel mt-3 table-responsive"><table class="table"><tr><th>Month</th><th>Client</th><th>Summary</th><th>Export</th></tr>{% for r in reports %}<tr><td>{{r.month}}</td><td>{{r.client.company_name}}</td><td>{{r.summary}}</td><td><a class="btn btn-sm btn-outline-primary" href="{{ url_for('report_pdf', rid=r.id) }}">PDF</a></td></tr>{% endfor %}</table></div>{% endblock %}
